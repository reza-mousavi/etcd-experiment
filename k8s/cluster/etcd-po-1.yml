apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: null
  labels:
    run: etcd1
    tier: backend
    cluster: etcd
  name: etcd1
  namespace: ds
spec:
  containers:
  - image: gcr.io/etcd-development/etcd:v3.7.0
    name: etcd1
    command:
    - /usr/local/bin/etcd
    - --name=etcd1
    - --data-dir=/etcd-data
    - --listen-client-urls=http://0.0.0.0:2379 
    - --advertise-client-urls=http://etcd1-headless.ds.svc.cluster.local:2379
    - --listen-peer-urls=http://0.0.0.0:2380 
    - --initial-advertise-peer-urls=http://etcd1-headless.ds.svc.cluster.local:2380
    - --initial-cluster-token=tkn 
    - --initial-cluster-state=new
    - --initial-cluster=etcd1=http://etcd1-headless.ds.svc.cluster.local:2380,etcd2=http://etcd2-headless.ds.svc.cluster.local:2380,etcd3=http://etcd3-headless.ds.svc.cluster.local:2380
    - --log-level=info
    - --logger=zap
    - --log-outputs=stderr

    ports:
    - containerPort: 2379
    - containerPort: 2380
    resources: {}
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
