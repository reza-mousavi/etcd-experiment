apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ds
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      imagePullSecrets:
        - name: rezamda
      containers:
        - name: order-service
          image: rezamda/order-service:1.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8443
              name: https
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/mydb
            - name: SPRING_DATASOURCE_USERNAME
              value: sc_order
            - name: SPRING_DATASOURCE_PASSWORD
              value: "123456"
            - name : APP_INTEGRATION_CUSTOMERSERVICE_ENDPOINT
              value: http://customer-service:8080/
            - name: APP_INTEGRATION_PRODUCTSERVICE_ENDPOINT
              value: http://product-service:8080/
            - name: SERVER_PORT
              value: "8443"
            - name: SERVER_SSL_BUNDLE
              value: tls
            - name: SPRING_SSL_BUNDLE_PEM_TLS_KEYSTORE_PRIVATE_KEY
              value: file:/tls/server.key
            - name: SPRING_SSL_BUNDLE_PEM_TLS_KEYSTORE_CERTIFICATE
              value: file:/tls/server.crt

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8443
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8443
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: logback-config
              mountPath: /logback-spring.xml
              subPath: logback-spring.xml
            - name: app-logs
              mountPath: /app
            - name: tls-config
              mountPath: /tls
      volumes:
        - name: tls-config
          configMap:
            name: tls
        - name: logback-config
          configMap:
            name: order-service
        - name: app-logs
          emptyDir: {}
