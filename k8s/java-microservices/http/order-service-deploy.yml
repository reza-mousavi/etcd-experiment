apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ds
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      imagePullSecrets:
        - name: rezamda
      containers:
        - name: order-service
          args:
            - "--spring.config.location=file:/config/"
            - "--logging.config=file:/config/logback-spring.xml"
          image: rezamda/order-service:1.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: order-service-config
              mountPath: /config
            - name: app-logs
              mountPath: /app
      volumes:
        - name: order-service-config
          configMap:
            name: order-service
        - name: app-logs
          emptyDir: {}

