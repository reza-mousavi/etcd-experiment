apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: ds
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      imagePullSecrets:
        - name: rezamda
      containers:
        - name: product-service
          args:
            - "--spring.config.location=file:/config/"
            - "--logging.config=file:/config/logback-spring.xml"
          image: rezamda/product-service:1.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8443
              name: https
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/mydb
            - name: SPRING_DATASOURCE_USERNAME
              value: sc_product
            - name: SPRING_DATASOURCE_PASSWORD
              value: "123456"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5

          volumeMounts:
            - name: product-service-config
              mountPath: /config
            - name: app-logs
              mountPath: /app
      volumes:
        - name: product-service-config
          configMap:
            name: product-service
        - name: app-logs
          emptyDir: {}

